# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=${SPRING_APPLICATION_NAME:aslenix-attendance}

# ==========================================
# MYSQL DATASOURCE
# ==========================================
# Can be overridden entirely via DB_URL or configured via DB_HOST, DB_PORT, and DB_NAME
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aslenix_attendance}?useSSL=false&serverTimezone=Asia/Kathmandu&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Samip.....}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8080}

# ==========================================
# MULTIPART / FILE UPLOADS
# ==========================================
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# ==========================================
# INITIAL SETUP & ADMIN PROVISIONING
# ==========================================
# Set AUTO_CREATE_ADMIN=true to automatically seed an initial admin on empty databases.
# When false (default), opening http://localhost:8080/ on an empty database opens the Web Setup Wizard at /setup.
app.setup.auto-create-admin=${AUTO_CREATE_ADMIN:false}
app.setup.initial-admin-username=${INITIAL_ADMIN_USERNAME:admin}
app.setup.initial-admin-password=${INITIAL_ADMIN_PASSWORD:}
app.setup.initial-admin-name=${INITIAL_ADMIN_NAME:System Administrator}
app.setup.initial-admin-email=${INITIAL_ADMIN_EMAIL:admin@aslenix.local}