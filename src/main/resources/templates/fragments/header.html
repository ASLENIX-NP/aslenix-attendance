<html lang="en" xmlns:th="http://www.thymeleaf.org">
<header class="top-header" th:fragment="header">
    <div class="header-right">

        <!-- NOTIFICATIONS -->
        <div class="notification-wrapper">
            <button type="button" class="notification-button" id="notificationButton"
                aria-label="Notifications" aria-expanded="false">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M10 21h4"></path>
                </svg>
                <span class="notification-dot" id="notificationDot"></span>
            </button>

            <div class="notification-dropdown" id="notificationDropdown" aria-hidden="true">
                <div class="notification-dropdown-header">
                    <div class="notification-header-title">
                        <strong>Notifications</strong>
                        <span class="notification-header-count" id="notificationHeaderCount">0</span>
                    </div>
                    <button type="button" class="mark-all-read-button" id="markAllReadButton" disabled>
                        Mark all as read
                    </button>
                </div>
                <div class="notification-dropdown-body" id="notificationDropdownBody">
                    <div class="notification-loading">
                        <div class="notification-spinner"></div>
                        <span>Loading notifications...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- PROFILE -->
        <div class="profile-wrapper">
            <button type="button" class="profile" id="profileButton" aria-label="Open profile menu"
                aria-expanded="false">
                <div class="profile-avatar">
                    <img th:if="${employee != null and employee.photoUrl != null and !employee.photoUrl.isEmpty()}"
                         th:src="@{${employee.photoUrl}}"
                         alt="Avatar"
                         class="header-avatar-img">
                    <span th:unless="${employee != null and employee.photoUrl != null and !employee.photoUrl.isEmpty()}"
                          th:text="${employee != null and employee.firstName != null and !employee.firstName.isEmpty()
                                    ? employee.firstName.substring(0,1).toUpperCase()
                                    : 'E'}">E</span>
                </div>
                <div class="profile-info">
                    <div class="profile-name" th:text="${employee != null ? (employee.firstName + ' ' + (employee.lastName != null ? employee.lastName : '')) : 'Employee'}">
                        Employee
                    </div>
                    <div class="profile-role">
                        Employee Portal
                    </div>
                </div>
            </button>

            <div class="profile-dropdown" id="profileDropdown">
                <a th:href="@{/employee/profile}" class="profile-dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
                    </svg>
                    <span>Profile</span>
                </a>
                <div class="profile-dropdown-divider"></div>
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="profile-dropdown-item logout-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M10 17l5-5-5-5"></path>
                            <path d="M15 12H3"></path>
                            <path d="M21 19V5a2 2 0 0 0-2-2h-6"></path>
                        </svg>
                        <span>Logout</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- CURRENT DATE -->
        <div class="header-date">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="17" rx="2"></rect>
                <path d="M16 2v4"></path>
                <path d="M8 2v4"></path>
                <path d="M3 10h18"></path>
            </svg>
            <span id="headerBsDate">Loading...</span>
        </div>

    </div>
</header>
</html>
