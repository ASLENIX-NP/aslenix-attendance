<html lang="en" xmlns:th="http://www.thymeleaf.org">
<header class="top-header" th:fragment="header">
                <!-- HEADER RIGHT -->

                <div class="header-right">


                    <!-- NOTIFICATIONS -->

                    <div class="notification-container">
                        <button type="button" class="notification-button" id="notificationBtn" aria-label="Notifications">
    
                            <svg viewBox="0 0 24 24">
    
                                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
    
                                <path d="M10 21h4"></path>
    
                            </svg>
    
                            <span class="notification-dot" id="notificationDot" style="display: none;"></span>
    
                        </button>
                        
                        <div class="notification-dropdown" id="notificationDropdown">
                            <div class="notification-header">
                                <h3>Notifications</h3>
                                <button type="button" class="mark-all-read" id="markAllReadBtn">Mark all read</button>
                            </div>
                            <div class="notification-list" id="notificationList">
                                <!-- Notifications injected by JS -->
                            </div>
                        </div>
                    </div>


                    <!-- PROFILE -->

                    <div class="profile-wrapper" style="position: relative;">
                        <button
                            type="button"
                            class="profile"
                            id="profileBtn"
                            aria-label="Open my profile menu"
                        >

                            <div class="profile-avatar">
                                <span
                                    th:if="${employee.firstName != null and !employee.firstName.isEmpty()}"
                                    th:text="${#strings.substring(employee.firstName, 0, 1).toUpperCase()}"
                                >E</span>

                                <span
                                    th:unless="${employee.firstName != null and !employee.firstName.isEmpty()}"
                                >E</span>
                            </div>

                            <div class="profile-info">

                                <div
                                    class="profile-name"
                                    th:text="${employee.firstName + (employee.lastName != null and !employee.lastName.isEmpty() ? ' ' + employee.lastName : '')}"
                                >
                                    Employee
                                </div>

                                <div class="profile-role">
                                    Employee Portal
                                </div>

                            </div>

                            <svg
                                class="profile-arrow"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                aria-hidden="true"
                            >
                                <path d="m6 9 6 6 6-6"></path>
                            </svg>

                        </button>
                        
                        <div class="profile-dropdown" id="profileDropdown">
                            <a th:href="@{/employee/profile}" class="profile-dropdown-item">
                                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                My Profile
                            </a>
                            <form th:action="@{/logout}" method="post" style="margin: 0;">
                                <button type="submit" class="profile-dropdown-item signout">
                                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                                    Sign Out
                                </button>
                            </form>
                        </div>
                    </div>


                    <!-- CURRENT DATE -->

                    <div class="header-date">

                        <svg viewBox="0 0 24 24">

                            <rect x="3" y="4" width="18" height="17" rx="2"></rect>

                            <path d="M16 2v4"></path>
                            <path d="M8 2v4"></path>
                            <path d="M3 10h18"></path>

                        </svg>

                        <span id="headerBsDate">
                            Loading...
                        </span>

                    </div>

                </div>

            </header>
</html>
