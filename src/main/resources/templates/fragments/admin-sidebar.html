            <!-- =================================================

                <div class="sidebar-icon">

                        <rect x="3"

                 PROFILE
            ================================================== -->

            <a th:href="@{/employee/profile}"
               class="sidebar-link">

                <div class="sidebar-icon">

                    <svg viewBox="0 0 24 24"
                         aria-hidden="true">

                        <circle cx="12"
