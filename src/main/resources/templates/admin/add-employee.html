<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASLENIX | Add Employee</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #0f172a;
            color: white;

            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
        }

        .back {
            color: white;
            text-decoration: none;

            background: #2563eb;

            padding: 10px 18px;

            border-radius: 8px;
        }

        main {
            padding: 40px;
        }

        .container {
            max-width: 750px;

            margin: 0 auto;

            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #0f172a;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;

            margin-bottom: 30px;
        }

        .section-title {
            margin-top: 25px;
            margin-bottom: 18px;

            padding-bottom: 8px;

            border-bottom: 1px solid #e2e8f0;

            color: #0f172a;

            font-size: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 700;

            color: #334155;
        }

        input,
        select {

            width: 100%;

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            background: white;
        }

        input:focus,
        select:focus {

            border-color: #2563eb;
        }

        .row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        button {

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .save {

            background: #16a34a;

            color: white;
        }

        .save:hover {

            background: #15803d;
        }

        .cancel {

            background: #e2e8f0;

            color: #334155;

            text-decoration: none;

            padding: 12px 20px;

            border-radius: 8px;

            font-weight: 700;
        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
        }

        .info {

            background: #eff6ff;

            color: #1d4ed8;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            main {
                padding: 20px;
            }

            .container {
                padding: 25px;
            }

            .row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="brand">
        ASLENIX ADMIN
    </div>

    <a href="/admin/employees"
       class="back">

        Employees

    </a>

</header>


<main>

    <div class="container">

        <h1>Add Employee</h1>

        <p class="subtitle">
            Create a new employee and their login account.
        </p>


        <!-- ERROR: EMPLOYEE CODE -->

        <div
                th:if="${param.error != null and param.error[0] == 'code'}"
                class="error">

            Employee code already exists.

        </div>


        <!-- ERROR: USERNAME -->

        <div
                th:if="${param.error != null and param.error[0] == 'username'}"
                class="error">

            Username already exists.

        </div>


        <!-- ERROR: EMAIL -->

        <div
                th:if="${param.error != null and param.error[0] == 'email'}"
                class="error">

            Email already exists.

        </div>


        <div class="info">

            The employee will receive an account with
            <strong>EMPLOYEE</strong> access.

        </div>


        <form
                th:action="@{/admin/employees/add}"
                th:object="${employee}"
                method="post">


            <!-- ========================= -->
            <!-- PERSONAL INFORMATION -->
            <!-- ========================= -->

            <div class="section-title">
                Personal Information
            </div>


            <div class="row">

                <div class="form-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                            type="text"
                            id="firstName"
                            th:field="*{firstName}"
                            placeholder="Enter first name"
                            required>

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                            type="text"
                            id="lastName"
                            th:field="*{lastName}"
                            placeholder="Enter last name"
                            required>

                </div>

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="employeeCode">
                        Employee Code
                    </label>

                    <input
                            type="text"
                            id="employeeCode"
                            th:field="*{employeeCode}"
                            placeholder="e.g. ASL-0001"
                            required>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                            type="text"
                            id="phone"
                            th:field="*{phone}"
                            placeholder="Enter phone number">

                </div>

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            th:field="*{email}"
                            placeholder="employee@example.com"
                            required>

                </div>


                <div class="form-group">

                    <label for="joiningDate">
                        Joining Date
                    </label>

                    <input
                            type="date"
                            id="joiningDate"
                            th:field="*{joiningDate}"
                            required>

                </div>

            </div>


            <div class="form-group">

                <label for="position">
                    Position
                </label>

                <input
                        type="text"
                        id="position"
                        th:field="*{position}"
                        placeholder="e.g. Backend Developer"
                        required>

            </div>


            <div class="form-group">

                <label for="departmentId">
                    Department
                </label>

                <select
                        id="departmentId"
                        name="departmentId"
                        required>

                    <option value="">
                        Select Department
                    </option>

                    <option
                            th:each="department : ${departments}"
                            th:value="${department.id}"
                            th:text="${department.name}">

                    </option>

                </select>

            </div>


            <!-- ========================= -->
            <!-- LOGIN INFORMATION -->
            <!-- ========================= -->

            <div class="section-title">
                Login Information
            </div>


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter login username"
                        required>

            </div>


            <div class="form-group">

                <label for="password">
                    Temporary Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter temporary password"
                        minlength="6"
                        required>

            </div>


            <!-- ========================= -->
            <!-- BUTTONS -->
            <!-- ========================= -->

            <div class="buttons">

                <button
                        type="submit"
                        class="save">

                    Save Employee

                </button>


                <a
                        href="/admin/employees"
                        class="cancel">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</main>

</body>

</html>
