<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASLENIX | Add Employee</title>

    <!-- NEPALI DATE PICKER -->

    <link
            rel="stylesheet"
            href="https://nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/css/nepali.datepicker.v5.0.6.min.css">

    <script
            src="https://nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/js/nepali.datepicker.v5.0.6.min.js">
    </script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #0f172a;
            color: white;

            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
        }

        .back {
            color: white;
            text-decoration: none;

            background: #2563eb;

            padding: 10px 18px;

            border-radius: 8px;
        }

        main {
            padding: 40px;
        }

        .container {
            max-width: 750px;

            margin: 0 auto;

            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                    0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #0f172a;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;

            margin-bottom: 30px;
        }

        .section-title {
            margin-top: 25px;
            margin-bottom: 18px;

            padding-bottom: 8px;

            border-bottom: 1px solid #e2e8f0;

            color: #0f172a;

            font-size: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 700;

            color: #334155;
        }

        input,
        select {

            width: 100%;

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            background: white;
        }

        input:focus,
        select:focus {

            border-color: #2563eb;
        }

        .row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        button {

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .save {

            background: #16a34a;

            color: white;
        }

        .save:hover {

            background: #15803d;
        }

        .cancel {

            background: #e2e8f0;

            color: #334155;

            text-decoration: none;

            padding: 12px 20px;

            border-radius: 8px;

            font-weight: 700;
        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
        }

        .info {

            background: #eff6ff;

            color: #1d4ed8;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            main {
                padding: 20px;
            }

            .container {
                padding: 25px;
            }

            .row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="brand">
        ASLENIX ADMIN
    </div>

    <a href="/admin/employees"
       class="back">

        Employees

    </a>

</header>


<main>

    <div class="container">

        <h1>Add Employee</h1>

        <p class="subtitle">
            Create a new employee and their login account.
        </p>


        <!-- ERROR: EMPLOYEE CODE -->

        <div
                th:if="${param.error != null and param.error[0] == 'code'}"
                class="error">

            Employee code already exists.

        </div>


        <!-- ERROR: USERNAME -->

        <div
                th:if="${param.error != null and param.error[0] == 'username'}"
                class="error">

            Username already exists.

        </div>


        <!-- ERROR: EMAIL -->

        <div
                th:if="${param.error != null and param.error[0] == 'email'}"
                class="error">

            Email already exists.

        </div>


        <div class="info">

            The employee will receive an account with
            <strong>EMPLOYEE</strong> access.

        </div>


        <form
                th:action="@{/admin/employees/add}"
                th:object="${employee}"
                method="post">


            <!-- ========================= -->
            <!-- PERSONAL INFORMATION -->
            <!-- ========================= -->

            <div class="section-title">
                Personal Information
            </div>


            <div class="row">

                <div class="form-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                            type="text"
                            id="firstName"
                            th:field="*{firstName}"
                            placeholder="Enter first name"
                            required>

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                            type="text"
                            id="lastName"
                            th:field="*{lastName}"
                            placeholder="Enter last name"
                            required>

                </div>

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="employeeCode">
                        Employee Code
                    </label>

                    <input
                            type="text"
                            id="employeeCode"
                            th:field="*{employeeCode}"
                            placeholder="e.g. ASL-0001"
                            required>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                            type="text"
                            id="phone"
                            th:field="*{phone}"
                            placeholder="Enter phone number">

                </div>

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            th:field="*{email}"
                            placeholder="employee@example.com"
                            required>

                </div>


                <!-- ========================= -->
                <!-- JOINING DATE - NEPALI BS -->
                <!-- ========================= -->

                <div class="form-group">

                    <label for="joiningDateBs">
                        Joining Date
                    </label>

                    <!--
                        USER SELECTS NEPALI BS DATE HERE
                    -->

                    <input
                            type="text"
                            id="joiningDateBs"
                            placeholder="Select Nepali Date"
                            autocomplete="off"
                            required>


                    <!--
                        THIS HIDDEN INPUT SENDS
                        THE CONVERTED AD DATE
                        TO SPRING BOOT
                    -->

                    <input
                            type="hidden"
                            id="joiningDate"
                            th:field="*{joiningDate}">

                </div>

            </div>


            <div class="form-group">

                <label for="position">
                    Position
                </label>

                <input
                        type="text"
                        id="position"
                        th:field="*{position}"
                        placeholder="e.g. Backend Developer"
                        required>

            </div>


            <div class="form-group">

                <label for="departmentId">
                    Department
                </label>

                <select
                        id="departmentId"
                        name="departmentId"
                        required>

                    <option value="">
                        Select Department
                    </option>

                    <option
                            th:each="department : ${departments}"
                            th:value="${department.id}"
                            th:text="${department.name}">

                    </option>

                </select>

            </div>


            <!-- ========================= -->
            <!-- LOGIN INFORMATION -->
            <!-- ========================= -->

            <div class="section-title">
                Login Information
            </div>


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter login username"
                        required>

            </div>


            <div class="form-group">

                <label for="password">
                    Temporary Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter temporary password"
                        minlength="6"
                        required>

            </div>


            <!-- ========================= -->
            <!-- BUTTONS -->
            <!-- ========================= -->

            <div class="buttons">

                <button
                        type="submit"
                        class="save">

                    Save Employee

                </button>


                <a
                        href="/admin/employees"
                        class="cancel">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</main>


<!-- ========================= -->
<!-- NEPALI DATE CONVERSION -->
<!-- ========================= -->

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const nepaliDateInput =
            document.getElementById("joiningDateBs");

        const actualDateInput =
            document.getElementById("joiningDate");


        /*
         * =========================================================
         * NEPALI BS DATE PICKER
         * =========================================================
         *
         * Calendar remains Bikram Sambat.
         *
         * We only change the DISPLAY:
         *
         * Nepali:
         *   भाद्र २०८३
         *   आइत सोम मंगल बुध बिहि शुक्र शनि
         *
         * English:
         *   Bhadra 2083
         *   Sun Mon Tue Wed Thu Fri Sat
         *
         * The actual selected date is still BS.
         */


        /*
         * Initialize the Nepali Date Picker.
         */

        nepaliDateInput.nepaliDatePicker({

            ndpYear: true,

            ndpMonth: true,

            ndpYearCount: 100

        });


        /*
         * =========================================================
         * NEPALI NUMBER -> ENGLISH NUMBER
         * =========================================================
         */

        function convertNepaliNumbersToEnglish(value) {

            if (!value) {
                return value;
            }

            const nepaliNumbers =
                "०१२३४५६७८९";

            const englishNumbers =
                "0123456789";

            return value.replace(/[०-९]/g, function (character) {

                const index =
                    nepaliNumbers.indexOf(character);

                return index >= 0
                    ? englishNumbers[index]
                    : character;

            });

        }


        /*
         * =========================================================
         * BS DATE -> AD DATE
         * =========================================================
         */

        function convertBsToAd(bsDate) {

            if (!bsDate) {

                actualDateInput.value = "";

                return;

            }


            try {

                /*
                 * Make sure BS date contains English digits.
                 */

                bsDate =
                    convertNepaliNumbersToEnglish(bsDate);


                /*
                 * Convert BS -> AD.
                 */

                const adDate =
                    NepaliFunctions.BS2AD(bsDate);


                if (!adDate) {

                    actualDateInput.value = "";

                    return;

                }


                /*
                 * Format AD as YYYY-MM-DD.
                 */

                const year =
                    String(adDate.year);

                const month =
                    String(adDate.month)
                        .padStart(2, "0");

                const day =
                    String(adDate.day)
                        .padStart(2, "0");


                actualDateInput.value =
                    year
                    + "-"
                    + month
                    + "-"
                    + day;


            } catch (error) {

                console.error(
                    "BS to AD conversion error:",
                    error
                );

                actualDateInput.value = "";

            }

        }


        /*
         * =========================================================
         * SELECTED DATE
         * =========================================================
         */

        nepaliDateInput.addEventListener(
            "change",
            function () {

                let bsDate =
                    nepaliDateInput.value.trim();


                if (!bsDate) {

                    actualDateInput.value = "";

                    return;

                }


                /*
                 * Convert displayed Nepali digits
                 * into English digits.
                 */

                bsDate =
                    convertNepaliNumbersToEnglish(bsDate);


                /*
                 * Keep visible field as BS.
                 *
                 * Example:
                 *
                 * 2083-05-10
                 */

                nepaliDateInput.value = bsDate;


                /*
                 * Save AD date into hidden field.
                 */

                convertBsToAd(bsDate);


                console.log(
                    "Selected BS:",
                    bsDate
                );

                console.log(
                    "AD sent to Spring Boot:",
                    actualDateInput.value
                );

            }
        );


        /*
         * =========================================================
         * TRANSLATE PICKER DISPLAY
         * =========================================================
         *
         * The v5.0.6 library itself does not expose a language
         * option for the picker UI.
         *
         * Therefore we observe the picker DOM and replace the
         * Nepali labels/numbers with English equivalents.
         */


        const nepaliMonths = {

            "बैशाख": "Baisakh",
            "जेठ": "Jestha",
            "असार": "Asar",
            "श्रावण": "Shrawan",
            "भाद्र": "Bhadra",
            "आश्विन": "Ashwin",
            "कार्तिक": "Kartik",
            "मंसिर": "Mangsir",
            "पौष": "Poush",
            "माघ": "Magh",
            "फाल्गुण": "Falgun",
            "चैत्र": "Chaitra",

            /*
             * Some versions use these spellings.
             */

            "बैशाख": "Baisakh",
            "जेठ": "Jestha",
            "आषाढ": "Asar",
            "श्रावण": "Shrawan",
            "भाद्र": "Bhadra",
            "आश्विन": "Ashwin",
            "कार्तिक": "Kartik",
            "मंसिर": "Mangsir",
            "पौष": "Poush",
            "माघ": "Magh",
            "फाल्गुन": "Falgun",
            "चैत्र": "Chaitra"

        };


        const nepaliDays = {

            "आइत": "Sun",
            "सोम": "Mon",
            "मंगल": "Tue",
            "बुध": "Wed",
            "बिहि": "Thu",
            "शुक्र": "Fri",
            "शनि": "Sat",

            "आइतबार": "Sunday",
            "सोमबार": "Monday",
            "मंगलबार": "Tuesday",
            "बुधबार": "Wednesday",
            "बिहिबार": "Thursday",
            "बिहीबार": "Thursday",
            "शुक्रबार": "Friday",
            "शनिबार": "Saturday"

        };


        /*
         * Replace Nepali text and Nepali numbers
         * inside the date picker.
         */

        function translateDatePicker(root) {

            if (!root) {
                return;
            }


            /*
             * Walk through all text nodes.
             */

            const walker =
                document.createTreeWalker(
                    root,
                    NodeFilter.SHOW_TEXT
                );


            const textNodes = [];

            let currentNode;


            while (
                currentNode =
                walker.nextNode()
            ) {

                textNodes.push(currentNode);

            }


            textNodes.forEach(function (node) {

                let text =
                    node.nodeValue;


                /*
                 * Translate months.
                 */

                Object.keys(nepaliMonths).forEach(
                    function (nepali) {

                        text =
                            text.replace(
                                new RegExp(
                                    nepali,
                                    "g"
                                ),
                                nepaliMonths[nepali]
                            );

                    }
                );


                /*
                 * Translate weekdays.
                 */

                Object.keys(nepaliDays).forEach(
                    function (nepali) {

                        text =
                            text.replace(
                                new RegExp(
                                    nepali,
                                    "g"
                                ),
                                nepaliDays[nepali]
                            );

                    }
                );


                /*
                 * Translate Nepali numerals.
                 */

                text =
                    convertNepaliNumbersToEnglish(
                        text
                    );


                node.nodeValue = text;

            });

        }


        /*
         * =========================================================
         * OBSERVE DATE PICKER
         * =========================================================
         *
         * The picker is dynamically created when the input is
         * clicked. MutationObserver catches it immediately.
         */

        const observer =
            new MutationObserver(function (mutations) {

                mutations.forEach(function (mutation) {

                    mutation.addedNodes.forEach(
                        function (node) {

                            if (
                                node.nodeType ===
                                Node.ELEMENT_NODE
                            ) {

                                translateDatePicker(node);

                            }

                        }
                    );

                });


                /*
                 * Also translate the complete document
                 * after picker changes.
                 */

                translateDatePicker(document.body);

            });


        observer.observe(
            document.body,
            {
                childList: true,
                subtree: true
            }
        );


        /*
         * Also translate when the input is clicked.
         */

        nepaliDateInput.addEventListener(
            "click",
            function () {

                setTimeout(function () {

                    translateDatePicker(
                        document.body
                    );

                }, 10);


                setTimeout(function () {

                    translateDatePicker(
                        document.body
                    );

                }, 100);

            }
        );


        /*
         * Also translate when the input receives focus.
         */

        nepaliDateInput.addEventListener(
            "focus",
            function () {

                setTimeout(function () {

                    translateDatePicker(
                        document.body
                    );

                }, 50);

            }
        );

    });

</script>

</body>

</html>
