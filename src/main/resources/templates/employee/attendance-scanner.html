<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASLENIX | Attendance Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at 80% 10%,
                    rgba(37, 99, 235, 0.14),
                    transparent 30%
                ),
                #f1f5f9;
            color: #0f172a;
        }

        header {
            min-height: 72px;
            padding: 16px 30px;
            background: linear-gradient(135deg, #0f172a, #172554);
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 21px;
            font-weight: 800;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .scanner-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .title {
            text-align: center;
            margin-bottom: 8px;
            font-size: 26px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 14px;
        }

        .location {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #f8fafc;
            text-align: center;
        }

        .location-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 6px;
        }

        #locationStatus {
            font-weight: 700;
            color: #2563eb;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .result h2 {
            margin-bottom: 8px;
        }

        .result p {
            margin-top: 5px;
        }

        .distance {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 700;
        }
    </style>
</head>

<body>

<header>

    <div class="brand">
        ASLENIX ATTENDANCE
    </div>

    <a href="/employee/dashboard" class="back">
        ← Dashboard
    </a>

</header>

<main>

    <div class="scanner-card">

        <h1 class="title">
            Scan Employee ID
        </h1>

        <p class="subtitle">
            Scan the QR code on your ASLENIX employee ID card.
        </p>

        <div id="reader"></div>

        <div class="location">

            <div class="location-title">
                Office Location
            </div>

            <div id="locationStatus">
                Checking your location...
            </div>

        </div>

        <div id="result" class="result"></div>

    </div>

</main>


<script>

    let currentLatitude = null;
    let currentLongitude = null;
    let scanLocked = false;


    // ============================================================
    // GET EMPLOYEE LOCATION
    // ============================================================

    function getLocation() {

        const status =
            document.getElementById("locationStatus");

        if (!navigator.geolocation) {

            status.textContent =
                "Location is not supported by this device.";

            return;
        }

        navigator.geolocation.getCurrentPosition(

            function(position) {

                currentLatitude =
                    position.coords.latitude;

                currentLongitude =
                    position.coords.longitude;

                const accuracy =
                    Math.round(position.coords.accuracy);

                status.textContent =
                    "Location detected ✓ (" +
                    accuracy +
                    "m accuracy)";

            },

            function(error) {

                status.textContent =
                    "Location permission is required.";

                console.error(error);

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }


    // ============================================================
    // QR SCANNED
    // ============================================================

    function onScanSuccess(decodedText) {

        if (scanLocked) {
            return;
        }

        scanLocked = true;

        console.log("QR:", decodedText);

        if (
            currentLatitude === null ||
            currentLongitude === null
        ) {

            showError(
                "Location unavailable. Please allow location access and try again."
            );

            scanLocked = false;

            getLocation();

            return;
        }

        let token = extractToken(decodedText);

        if (!token) {

            showError(
                "Invalid ASLENIX employee QR code."
            );

            scanLocked = false;

            return;
        }

        processAttendance(
            token,
            currentLatitude,
            currentLongitude
        );
    }


    // ============================================================
    // EXTRACT QR TOKEN
    // ============================================================

    function extractToken(value) {

        try {

            const url =
                new URL(value);

            const parts =
                url.pathname.split("/");

            const index =
                parts.indexOf("verify-employee");

            if (
                index !== -1 &&
                parts[index + 1]
            ) {

                return parts[index + 1];
            }

        } catch (error) {

            console.error(error);

        }

        return null;
    }


    // ============================================================
    // SEND TO SPRING BOOT
    // ============================================================

    async function processAttendance(
        token,
        latitude,
        longitude
    ) {

        try {

            const response =
                await fetch(
                    "/api/attendance/qr",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            qrToken: token,

                            latitude: latitude,

                            longitude: longitude

                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                showError(
                    data.message ||
                    "Attendance could not be recorded."
                );

                scanLocked = false;

                return;
            }

            showSuccess(data);

        } catch (error) {

            console.error(error);

            showError(
                "Unable to connect to the attendance server."
            );

            scanLocked = false;
        }
    }


    // ============================================================
    // SUCCESS
    // ============================================================

    function showSuccess(data) {

        const result =
            document.getElementById("result");

        result.className =
            "result success";

        result.innerHTML = `

            <h2>✓ ${data.action}</h2>

            <p>
                <strong>${data.employeeName}</strong>
            </p>

            <p>
                ${data.employeeCode}
            </p>

            <p>
                ${data.time}
            </p>

            ${
                data.workingHours
                    ? `<p>
                        Working Hours:
                        <strong>${data.workingHours}</strong>
                       </p>`
                    : ""
            }

            <div class="distance">
                Location verified ✓
            </div>

        `;

        setTimeout(
            function() {

                result.style.display =
                    "none";

                scanLocked = false;

            },
            5000
        );
    }


    // ============================================================
    // ERROR
    // ============================================================

    function showError(message) {

        const result =
            document.getElementById("result");

        result.className =
            "result error";

        result.innerHTML = `

            <h2>✕ Attendance Denied</h2>

            <p>
                ${message}
            </p>

        `;

        result.style.display =
            "block";
    }


    // ============================================================
    // START LOCATION
    // ============================================================

    getLocation();


    // ============================================================
    // START QR SCANNER
    // ============================================================

    const scanner =
        new Html5Qrcode("reader");

    scanner.start(

        {
            facingMode: "environment"
        },

        {
            fps: 10,
            qrbox: {
                width: 250,
                height: 250
            }
        },

        onScanSuccess,

        function(errorMessage) {
            // Ignore normal scanner errors
        }

    ).catch(function(error) {

        console.error(error);

        showError(
            "Unable to access the camera. Please allow camera permission."
        );

    });

</script>

</body>

</html>
