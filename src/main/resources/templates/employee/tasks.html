<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASLENIX | My Tasks</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                    radial-gradient(
                            circle at 80% 10%,
                            rgba(37, 99, 235, 0.12),
                            transparent 30%
                    ),
                    #f1f5f9;
            color: #0f172a;
        }

        header {
            min-height: 76px;
            padding: 18px 40px;
            background:
                    linear-gradient(
                            135deg,
                            #0f172a,
                            #172554
                    );
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 23px;
            font-weight: 800;
        }

        .subtitle {
            margin-top: 4px;
            color: #bfdbfe;
            font-size: 12px;
        }

        .back {
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            background: #2563eb;
            font-size: 13px;
            font-weight: 700;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 40px;
        }

        .heading {
            margin-bottom: 28px;
        }

        .heading small {
            color: #2563eb;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .heading h1 {
            margin-top: 7px;
            font-size: 36px;
        }

        .heading p {
            margin-top: 8px;
            color: #64748b;
        }

        .task-grid {
            display: grid;
            grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .task {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            box-shadow:
                    0 7px 22px
                    rgba(15, 23, 42, 0.05);
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
        }

        .task h2 {
            font-size: 19px;
        }

        .description {
            margin-top: 15px;
            color: #64748b;
            line-height: 1.7;
            font-size: 14px;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .priority-high {
            background: #fee2e2;
            color: #b91c1c;
        }

        .priority-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .priority-low {
            background: #dcfce7;
            color: #15803d;
        }

        .status-assigned {
            background: #e0e7ff;
            color: #4338ca;
        }

        .status-completed {
            background: #fef3c7;
            color: #92400e;
        }

        .status-approved {
            background: #dcfce7;
            color: #15803d;
        }

        .status-rejected {
            background: #fee2e2;
            color: #b91c1c;
        }

        .due {
            margin-top: 15px;
            color: #475569;
            font-size: 13px;
        }

        .submission {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
        }

        textarea {
            width: 100%;
            min-height: 90px;
            margin-top: 10px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            resize: vertical;
            font-family: inherit;
        }

        .submit {
            margin-top: 10px;
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .note {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
        }

        .empty {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 50px;
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 800px) {

            header {
                padding: 16px 20px;
            }

            main {
                padding: 25px 20px;
            }

            .task-grid {
                grid-template-columns: 1fr;
            }

            .heading h1 {
                font-size: 30px;
            }
        }

    </style>

</head>

<body>

<header>

    <div>

        <div class="brand">
            ASLENIX EMPLOYEE
        </div>

        <div class="subtitle">
            My Tasks
        </div>

    </div>

    <a href="/employee/dashboard"
       class="back">
        ← Dashboard
    </a>

</header>

<main>

    <section class="heading">

        <small>
            EMPLOYEE WORKSPACE
        </small>

        <h1>
            My Tasks
        </h1>

        <p>
            Tasks assigned to you by the administrator.
        </p>

    </section>

    <section
            class="task-grid"
            th:if="${!#lists.isEmpty(tasks)}">

        <article
                class="task"
                th:each="task : ${tasks}">

            <div class="task-top">

                <h2
                        th:text="${task.title}">
                    Task title
                </h2>

                <span
                        class="badge"
                        th:text="${task.status}">
                    ASSIGNED
                </span>

            </div>

            <p
                    class="description"
                    th:text="${task.description}">
                Task description
            </p>

            <div class="meta">

                <span
                        class="badge"
                        th:text="${task.priority}">
                    MEDIUM
                </span>

                <span
                        class="badge"
                        th:if="${task.dueDate != null}"
                        th:text="'Due: ' + ${task.dueDate}">
                    Due date
                </span>

            </div>

            <div
                    class="submission"
                    th:if="${task.status == 'ASSIGNED' || task.status == 'REJECTED'}">

                <strong>
                    Submit completed work
                </strong>

                <form
                        th:action="@{/employee/tasks/{id}/complete(id=${task.id})}"
                        method="post">

                    <textarea
                            name="completionNote"
                            placeholder="Describe the work you completed..."
                            required></textarea>

                    <button
                            type="submit"
                            class="submit">
                        Submit Task
                    </button>

                </form>

            </div>

            <div
                    class="note"
                    th:if="${task.completionNote != null}">

                <strong>
                    Your submission:
                </strong>

                <br>

                <span
                        th:text="${task.completionNote}">
                </span>

            </div>

            <div
                    class="note"
                    th:if="${task.reviewNote != null}">

                <strong>
                    Admin review:
                </strong>

                <br>

                <span
                        th:text="${task.reviewNote}">
                </span>

            </div>

        </article>

    </section>

    <section
            class="empty"
            th:if="${#lists.isEmpty(tasks)}">

        <h2>
            No tasks assigned
        </h2>

        <p style="margin-top: 8px;">
            You currently don't have any tasks.
        </p>

    </section>

</main>

</body>

</html>
