<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASLENIX | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --aslenix-gradient: linear-gradient(
                135deg,
                #FF4D9D 0%,
                #ED4AC2 30%,
                #9855FF 55%,
                #428EFF 80%,
                #3EB1FC 100%
            );
            --aslenix-pink: #FF4D9D;
            --aslenix-magenta: #ED4AC2;
            --aslenix-purple: #9855FF;
            --aslenix-blue: #428EFF;
            --aslenix-light-blue: #3EB1FC;

            --background: #f4f7f6;
            --foreground: #102536;
            --card: #ffffff;
            --primary: var(--aslenix-pink);
            --primary-hover: var(--aslenix-magenta);
            --border: #dbe5e7;
            --muted: #6b7b85;
            --spectrum: var(--aslenix-gradient);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(circle at 88% 12%, rgba(122, 44, 255, 0.08), transparent 32%),
                radial-gradient(circle at 12% 88%, rgba(255, 10, 120, 0.07), transparent 35%),
                var(--background);
            color: var(--foreground);
            -webkit-font-smoothing: antialiased;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 36px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 42px rgba(16, 37, 54, 0.10);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 4px;
            background: var(--aslenix-gradient);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 850;
            letter-spacing: 0.8px;
            color: #102536;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .logo::after {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--aslenix-gradient);
            display: inline-block;
            margin: -2px 0 0;
        }

        .login-logo-mark {
            display: block;
            width: 74px;
            height: 74px;
            object-fit: contain;
            margin: 0 auto 12px;
            filter: drop-shadow(0 7px 14px rgba(122, 44, 255, 0.22));
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
            margin-top: 6px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: #f8fafc;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--aslenix-purple);
            background: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(122, 44, 255, 0.14);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-top: 1px solid rgba(255, 255, 255, 0.58);
            border-bottom: 1px solid rgba(0, 0, 0, 0.22);
            border-radius: 11px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0.12) 48%, rgba(255, 255, 255, 0.00) 52%, rgba(0, 0, 0, 0.10) 100%),
                linear-gradient(135deg, #FF4D9D 0%, #ED4AC2 30%, #9855FF 55%, #428EFF 80%, #3EB1FC 100%);
            background-color: #9855ff;
            color: white;
            font-size: 15px;
            font-weight: 750;
            cursor: pointer;
            box-shadow:
                inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.75),
                inset 0 -1.5px 0 0 rgba(0, 0, 0, 0.24),
                0 6px 18px rgba(152, 85, 255, 0.32),
                0 2px 4px rgba(0, 0, 0, 0.12);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
            position: relative;
            margin-top: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        button:hover {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.44) 0%, rgba(255, 255, 255, 0.18) 48%, rgba(255, 255, 255, 0.00) 52%, rgba(0, 0, 0, 0.06) 100%),
                linear-gradient(135deg, #FF4D9D 0%, #ED4AC2 30%, #9855FF 55%, #428EFF 80%, #3EB1FC 100%);
            transform: translateY(-1.5px);
            box-shadow:
                inset 0 1px 2px 0 rgba(255, 255, 255, 0.90),
                inset 0 -1.5px 0 0 rgba(0, 0, 0, 0.28),
                0 10px 24px rgba(152, 85, 255, 0.45),
                0 3px 6px rgba(0, 0, 0, 0.16);
            filter: brightness(1.03) saturate(1.08);
        }

        button:active {
            box-shadow:
                inset 0 2px 4px 0 rgba(0, 0, 0, 0.32),
                0 2px 6px rgba(152, 85, 255, 0.22);
            transform: translateY(1px);
        }

        .message {
            margin-bottom: 20px;
            padding: 11px 14px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .logout {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo"><img class="login-logo-mark" src="/images/aslenix.png" alt="ASLENIX">ASLENIX</div>

    <div class="subtitle">
        Attendance Management System
    </div>

    <div th:if="${param.error}" class="message error">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="message logout">
        You have been logged out successfully.
    </div>

    <form method="post" action="/login">

    <!-- CSRF protection -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <div class="form-group">
        <label for="username">Username</label>

        <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required>
    </div>

    <div class="form-group">
        <label for="password">Password</label>

        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>
    </div>

    <button type="submit">
        Sign In
    </button>

</form>

</div>

</body>
</html>
