# ==============================================================================
# RENDER BLUEPRINT (render.yaml)
# ASLENIX Attendance Management System
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: aslenix-attendance
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: JPA_DDL_AUTO
        value: update
      - key: THYMELEAF_CACHE
        value: true
      - key: AUTO_CREATE_ADMIN
        value: false
      - key: IMAGEKIT_PUBLIC_KEY
        value: public_ya787pz0qzjIbo0Wb7IYB+GHKww=
      - key: IMAGEKIT_PRIVATE_KEY
        value: private_wgG7O/RG43VOFhabN1zTrT77ZjM=
      - key: IMAGEKIT_URL_ENDPOINT
        value: https://ik.imagekit.io/7gqvkziy4c
      - key: IMAGEKIT_FOLDER
        value: /employee-photos
      # OPTION 1 (DEFAULT / 1-CLICK): Automatically wired to the free Render PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: aslenix-db
          property: connectionString

      # OPTION 2 (ALTERNATIVE): External MySQL Database (Aiven, TiDB, Railway, AWS RDS, etc.)
      # If using external MySQL, remove the DATABASE_URL above and uncomment the following:
      # - key: DB_HOST
      #   sync: false
      # - key: DB_PORT
      #   value: 3306
      # - key: DB_NAME
      #   sync: false
      # - key: DB_USERNAME
      #   sync: false
      # - key: DB_PASSWORD
      #   sync: false

# Render Managed Free PostgreSQL Database (automatically provisioned on Blueprint deploy)
databases:
  - name: aslenix-db
    plan: free
    region: oregon
    databaseName: aslenix_attendance
    user: aslenix
